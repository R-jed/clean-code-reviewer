name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          python -m pip install "git+https://github.com/agentskills/agentskills.git@217be548739f21d6008915c29aefe320ea1a90af#subdirectory=skills-ref"

      - name: Run repository integrity tests
        run: python -m unittest discover -s tests -v

      - name: Run repository validator
        run: python skills/clean-code-reviewer/scripts/validate_skill.py skills/clean-code-reviewer

      - name: Run Agent Skills reference validator
        run: skills-ref validate skills/clean-code-reviewer
